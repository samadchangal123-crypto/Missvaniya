<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woolen Profile Maker</title>
    <style>
        :root {
            --bg-color: #d8dee9;
            --card-bg: #f5f3eb;
            --wool-shadow: inset 6px 6px 12px #e2dfd5, inset -6px -6px 12px #ffffff;
            --outer-shadow: 15px 15px 30px #b0b0b0, -10px -10px 20px #ffffff;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .upload-container {
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Woolen Card Design */
        .card {
            background: var(--card-bg);
            width: 340px;
            padding: 30px 20px;
            border-radius: 45px;
            box-shadow: var(--outer-shadow);
            border: 6px solid #f0eee4;
            text-align: center;
            position: relative;
        }

        .profile-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #4a90e2;
            background: #eee;
            box-shadow: var(--wool-shadow);
        }

        .vibe-bubble {
            position: absolute;
            top: -15px;
            left: -20px;
            background: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            font-weight: bold;
        }

        h2 { margin: 20px 0 5px; font-size: 1.3rem; color: #333; }
        .stats { font-size: 0.85rem; color: #888; margin-bottom: 20px; }

        .bio { font-weight: 800; font-size: 0.95rem; margin: 15px 0; letter-spacing: 0.5px; }

        .music-player {
            background: #e9e7df;
            margin: 20px 0;
            padding: 12px;
            border-radius: 20px;
            box-shadow: var(--wool-shadow);
            font-size: 0.75rem;
        }

        .progress-bar {
            height: 4px;
            background: #333;
            width: 80%;
            margin: 8px auto;
            border-radius: 2px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 15px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 6px #bcbcbc;
        }

        .btn-blue { background: #3578e5; color: white; }
        .btn-grey { background: #cfd1d6; color: #1c1e21; }

    </style>
</head>
<body>

    <div class="upload-container">
        <label>Upload Screenshot: </label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="card">
        <div class="profile-container">
            <div class="vibe-bubble" id="vibeText">Current vibe...</div>
            <img id="outputImage" class="profile-pic" src="https://via.placeholder.com/150" alt="Profile">
        </div>

        <h2 id="cardTitle">Loading...</h2>
        <p class="stats" id="friendsCount">---</p>

        <p class="bio" id="bioText">---</p>

        <div class="music-player">
            <div class="progress-bar"></div>
            <div>04:02 ● 00:00</div>
            <p id="location" style="margin:5px 0 0; font-weight:bold;">---</p>
        </div>

        <div class="btn-group">
            <button class="btn btn-blue">+ Add to story</button>
            <button class="btn btn-grey">Edit profile</button>
        </div>
    </div>

    <script>
        // JSON data load karna
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('cardTitle').innerText = data.cardTitle;
                document.getElementById('friendsCount').innerText = data.friendsCount;
                document.getElementById('bioText').innerText = data.bioText;
                document.getElementById('location').innerText = data.location;
                document.getElementById('vibeText').innerText = data.vibeText;
            });

        // User ka SS handle karna
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function() {
                document.getElementById('outputImage').src = reader.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        });
    </script>
</body>
</html>
